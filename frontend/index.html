<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IndieForge AI — Game Content Generator</title>
  <style>
    :root {
      --bg:       #0e0f14;
      --surface:  #161820;
      --card:     #1e2130;
      --border:   #2a2d3e;
      --accent:   #7c6af7;
      --accent2:  #e06cf0;
      --text:     #e2e4f0;
      --muted:    #7a7d9c;
      --success:  #4ade80;
      --error:    #f87171;
      --npc:      #f59e0b;
      --quest:    #3b82f6;
      --item:     #10b981;
      --lore:     #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---------- LAYOUT ---------- */
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-sub {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 400;
    }

    nav { margin-left: auto; display: flex; gap: 8px; }

    .tab-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .tab-btn:hover  { border-color: var(--accent); color: var(--text); }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    main { flex: 1; padding: 32px; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* ---------- TYPE SELECTOR ---------- */
    .type-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .type-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .type-card:hover  { border-color: var(--accent); transform: translateY(-2px); }
    .type-card.active { border-color: var(--accent); background: #1f1e3a; }

    .type-icon { font-size: 2rem; margin-bottom: 6px; }
    .type-label { font-size: 0.9rem; font-weight: 600; }
    .type-desc  { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

    /* ---------- FORM ---------- */
    .form-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }

    .form-field input,
    .form-field select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
      transition: border-color 0.15s;
      outline: none;
    }
    .form-field input:focus,
    .form-field select:focus { border-color: var(--accent); }
    .form-field select option { background: var(--card); }

    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.03em;
    }
    .btn-generate:hover    { opacity: 0.9; transform: translateY(-1px); }
    .btn-generate:active   { transform: translateY(0); }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ---------- RESULT CARD ---------- */
    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .result-badge {
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .badge-npc   { background: #3d2e0a; color: var(--npc);   }
    .badge-quest { background: #0d1f3c; color: var(--quest); }
    .badge-item  { background: #0a2d20; color: var(--item);  }
    .badge-lore  { background: #1e1240; color: var(--lore);  }
    .badge-fallback { background: #2a1516; color: var(--error); margin-left: auto; }

    .result-title { font-size: 1.1rem; font-weight: 700; }

    .result-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--text); }
    .icon-btn.fav   { border-color: #f59e0b; color: #f59e0b; }

    /* ---------- JSON DISPLAY ---------- */
    .json-display {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .json-key     { color: #7dd3fc; }
    .json-string  { color: #86efac; }
    .json-number  { color: #fb923c; }
    .json-bool    { color: #c084fc; }
    .json-null    { color: var(--muted); }

    /* ---------- FIELDS GRID ---------- */
    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .field-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .field-key   { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .field-value { font-size: 0.9rem; }

    .array-item { display: inline-block; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; margin: 2px; font-size: 0.8rem; }

    /* ---------- HISTORY / FAVORITES ---------- */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .history-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .history-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .history-card-title { font-weight: 600; font-size: 0.9rem; }
    .history-card-time { font-size: 0.72rem; color: var(--muted); margin-left: auto; }
    .history-card-preview { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }

    /* ---------- SPINNER ---------- */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--success);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      animation: slideUp 0.2s ease;
      z-index: 100;
    }
    .toast.error { border-left-color: var(--error); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ---------- EMPTY STATE ---------- */
    .empty-state { text-align: center; padding: 64px; color: var(--muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; }

    @media (max-width: 768px) {
      main { padding: 16px; }
      .type-grid { grid-template-columns: repeat(2, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
      .fields-grid { grid-template-columns: 1fr; }
      .history-grid { grid-template-columns: 1fr; }
    }

    /* ---------- TYPE BADGES (weapon / enemy) ---------- */
    .badge-weapon { background: #3d0a0a; color: #ef4444; }
    .badge-enemy  { background: #1a1a2e; color: #9ca3af; }

    /* ---------- SOCIAL LAYOUT ---------- */
    .social-layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .social-main    { flex: 1; min-width: 0; }
    .social-sidebar {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---------- SOCIAL SUB-TABS ---------- */
    .social-subtabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .subtab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.15s;
    }
    .subtab-btn:hover  { border-color: var(--accent); color: var(--text); }
    .subtab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .subtab-btn.share-btn {
      margin-left: auto;
      border-color: var(--accent2);
      color: var(--accent2);
    }
    .subtab-btn.share-btn:hover { background: var(--accent2); color: #fff; }

    /* ---------- FILTER BANNER ---------- */
    .filter-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1f1e3a;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }
    .clear-filter-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      margin-left: auto;
      font-size: 0.8rem;
    }
    .clear-filter-btn:hover { color: var(--error); }

    /* ---------- POST CARD ---------- */
    .posts-list { display: flex; flex-direction: column; gap: 14px; }

    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      transition: border-color 0.15s;
      animation: fadeIn 0.25s ease;
    }
    .post-card:hover { border-color: var(--accent); }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .post-title  { font-weight: 600; font-size: 0.95rem; flex: 1; }
    .post-author { font-size: 0.72rem; color: var(--accent); font-family: monospace; }
    .post-time   { font-size: 0.72rem; color: var(--muted); }
    .post-expand { font-size: 0.7rem; color: var(--muted); }

    .post-description {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-style: italic;
    }

    .post-preview {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 8px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .post-body {
      margin-bottom: 10px;
    }

    /* ---------- TAG PILLS ---------- */
    .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.12s;
    }
    .tag-pill:hover  { border-color: var(--accent); color: var(--text); }
    .tag-pill.followed { background: #1f1e3a; border-color: var(--accent); color: var(--accent); }

    .tag-count {
      background: var(--border);
      border-radius: 99px;
      padding: 0 5px;
      font-size: 0.68rem;
    }
    .tag-remove {
      font-size: 0.65rem;
      opacity: 0.6;
    }
    .tag-unfollow {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      font-size: 0.65rem;
      line-height: 1;
    }
    .tag-unfollow:hover { color: var(--error); }

    /* ---------- POST FOOTER BUTTONS ---------- */
    .post-footer {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .like-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .like-btn:hover  { border-color: #f43f5e; color: #f43f5e; }
    .like-btn.liked  { border-color: #f43f5e; color: #f43f5e; }

    .comment-toggle-btn,
    .explore-tag-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .comment-toggle-btn:hover { border-color: var(--accent); color: var(--text); }
    .explore-tag-btn:hover    { border-color: var(--accent2); color: var(--accent2); }

    .delete-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: auto;
      transition: all 0.15s;
    }
    .delete-btn:hover { border-color: var(--error); color: var(--error); }

    /* ---------- COMMENTS ---------- */
    .comments-section {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .comments-empty,
    .comments-loading { font-size: 0.8rem; color: var(--muted); padding: 8px 0; }

    .comment-item {
      margin-bottom: 10px;
      padding: 8px 10px;
      background: var(--surface);
      border-radius: 8px;
    }
    .comment-meta    { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
    .comment-author  { font-size: 0.72rem; color: var(--accent); font-family: monospace; font-weight: 600; }
    .comment-time    { font-size: 0.68rem; color: var(--muted); }
    .comment-content { font-size: 0.82rem; line-height: 1.5; }

    .comment-input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .comment-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .comment-input:focus { border-color: var(--accent); }

    .comment-send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.15s;
    }
    .comment-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---------- SOCIAL LOADING ---------- */
    .social-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      padding: 40px 0;
      justify-content: center;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .sidebar-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .sidebar-empty { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
    .sidebar-tags  { display: flex; flex-wrap: wrap; gap: 6px; }

    /* ---------- PUBLISH MODAL ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 520px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeIn 0.2s ease;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 1rem; }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body  { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer{
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }

    .form-field textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .form-field textarea:focus { border-color: var(--accent); }

    .tag-input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      min-height: 40px;
      transition: border-color 0.15s;
    }
    .tag-input-row:focus-within { border-color: var(--accent); }
    .tag-inline-input {
      flex: 1;
      min-width: 80px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.85rem;
    }

    .publi-preview {
      display: flex;
      align-items: center;
      padding: 10px;
      background: var(--card);
      border-radius: 8px;
      border: 1px dashed var(--border);
    }

    .share-icon-btn { border-color: var(--accent2); color: var(--accent2); }
    .share-icon-btn:hover { background: var(--accent2); color: #fff; }

    /* ---------- RESPONSIVE (social) ---------- */
    @media (max-width: 900px) {
      .social-layout { flex-direction: column; }
      .social-sidebar { width: 100%; }
    }

    /* ---------- SORT / EXPLORE CONTROLS ---------- */
    .explore-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .sort-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sort-label { font-size: 0.8em; color: var(--muted); }
    .sort-btn {
      padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; font-size: 0.82em;
      transition: all .15s;
    }
    .sort-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sort-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ---------- ILLUSTRATOR PANEL ---------- */
    .illustrator-panel {
      margin-top: 16px; padding: 16px; border-radius: 10px;
      background: rgba(139,92,246,0.06); border: 1px solid rgba(139,92,246,0.25);
    }
    .illustrator-header {
      font-size: 0.9em; font-weight: 600; color: var(--accent2);
      margin-bottom: 12px;
    }
    .illustrator-angles { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .angle-btn {
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer; font-size: 0.82em;
      position: relative; transition: all .15s;
    }
    .angle-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .angle-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
    .angle-btn.has-image { border-color: #10b981; }
    .angle-dot { position: absolute; top: 2px; right: 4px; font-size: 0.5em; color: #10b981; }
    .btn-illustrate {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 8px;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: #fff; border: none; cursor: pointer; font-size: 0.88em;
      font-weight: 600; transition: opacity .15s;
    }
    .btn-illustrate:hover { opacity: 0.88; }
    .btn-illustrate:disabled { opacity: 0.5; cursor: not-allowed; }
    .illustrator-error {
      margin-top: 10px; padding: 10px 14px; border-radius: 8px;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; font-size: 0.83em;
    }
    .illustrator-image-wrap {
      margin-top: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
    }
    .illustrator-image {
      width: 100%; max-width: 512px; border-radius: 10px;
      border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .illustrator-download {
      font-size: 0.82em; color: var(--accent2); text-decoration: none;
      padding: 4px 10px; border: 1px solid var(--accent2); border-radius: 6px;
    }
    .illustrator-download:hover { background: var(--accent2); color: #fff; }
    /* Post image (shared illustrations in social feed) */
    .post-image-wrap {
      margin: 8px 0; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .post-image {
      width: 100%; display: block; max-height: 420px; object-fit: contain;
      background: #0d0d14;
    }
    /* PublicarModal image attachment */
    .modal-image-attached {
      display: flex; align-items: center; margin-top: 8px;
      padding: 6px 10px; border-radius: 8px;
      background: rgba(16,185,129,0.12); border: 1px solid #10b981;
    }
    .image-attached-badge { font-size: 0.88em; color: #10b981; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
